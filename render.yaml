# Render Blueprint: one web service + one PostgreSQL database.
# Render → New → Blueprint → pick this repo. Secrets are generated for you.
# Configured as a DEMO deployment (demo data + /demo guide). For real use,
# delete DEMO_MODE and ALLOW_DEMO_IN_PRODUCTION and add SMTP settings.
services:
  - type: web
    name: attendance
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: attendance-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      - key: DEFAULT_TIMEZONE
        value: Asia/Singapore
      - key: DEMO_MODE
        value: "true"
      - key: ALLOW_DEMO_IN_PRODUCTION
        value: "true"

databases:
  - name: attendance-db
    plan: free
    region: singapore
    databaseName: attendance
    user: attendance
